# Только для проверки на стенде: собирает образ оператора из этой ветки
# и отдаёт его артефактом (tar), чтобы импортировать в containerd лабы.
# В апстрим не предлагается.
name: lab-image
on:
  workflow_dispatch:
  push:
    branches: [ci/lab-image]
jobs:
  operator:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build operator image to tar
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: manager
          platforms: linux/amd64
          push: false
          tags: ghcr.io/andreyza/slurm-operator:zerofix
          outputs: type=docker,dest=/tmp/slurm-operator-zerofix.tar
      - uses: actions/upload-artifact@v4
        with:
          name: slurm-operator-zerofix
          path: /tmp/slurm-operator-zerofix.tar
          retention-days: 3
