# Только для проверки на стенде: собирает образ оператора из этой ветки
# и пушит в ghcr.io форка. В апстрим не предлагается.
name: lab-image
on:
  workflow_dispatch:
  push:
    branches: [ci/lab-image]
jobs:
  operator:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push operator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: manager
          platforms: linux/amd64
          push: true
          tags: ghcr.io/andreyza/slurm-operator:zerofix-${{ github.sha }}
